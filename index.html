<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/colors.css" />
    <link rel="stylesheet" href="/src/common-style.css" />
    <link rel="stylesheet" href="/src/utils.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colour Contrast Analyser</title>
  </head>

  <body>
    <main x-data x-effect="document.title = $store.uiStore.t('app.title'); document.documentElement.lang = $store.uiStore.locale">
      <h1 class="sr-only" x-text="$store.uiStore.t('app.title')">Colour Contrast Analyser</h1>
      <div class="colors" x-data="{ rotated: false, showControls: false, showBgControls: false, fgSliderMode: 'dynamic', bgSliderMode: 'dynamic' }">
        <!-- Foreground Color -->
        <div class="wrapper" x-bind:style="`background-color: ${showControls ? '#ffffff' : $store.uiStore.backgroundHex}`">
          <section id="foreground"
            x-bind:style="`background-color: ${$store.uiStore.foregroundHex}`"
          >
            <div
              class="color-preview"
              x-bind:class="$store.uiStore.foregroundIsDark ? 'isDark' : 'isLight'"
            >
              <h2 x-text="$store.uiStore.t('color.foreground')">Foreground</h2>
              <p class="color-value">
                <span class="color-name" x-show="$store.uiStore.foregroundName" x-text="$store.uiStore.foregroundName"></span>
                <span class="hex-value" :class="{ 'hex-secondary': $store.uiStore.foregroundName }" x-text="$store.uiStore.foregroundHex"></span>
              </p>
            </div>
            <div class="buttons">
              <button
                class="btn invert"
                x-bind:class="{ rotated }"
                @click="$store.uiStore.switchColor(); rotated = !rotated"
                x-bind:disabled="$store.uiStore.isPicking"
                x-bind:aria-label="$store.uiStore.t('color.pick_switch')"
              >
                <svg-icon name="swap"></svg-icon>
              </button>
              <div class="group">
                <button
                  class="btn eyedropper"
                  @click="$store.uiStore.pickColor(true)"
                  x-bind:disabled="$store.uiStore.isPicking"
                  x-bind:aria-label="$store.uiStore.t('color.pick_foreground')"
                >
                  <svg-icon name="eyedropper" size="24px"></svg-icon>
                </button>
                <button
                  class="btn"
                  @click="showControls = !showControls"
                  x-bind:disabled="$store.uiStore.isPicking"
                >
                  <svg-icon name="sliders"></svg-icon>
                </button>
              </div>
            </div>
          </section>
        </div>
        <!-- Foreground Color controls -->
        <div class="color-controls" x-bind:class="'slider-mode-' + fgSliderMode" x-show="showControls" x-transition>
          <button class="btn-slider-mode" @click="fgSliderMode = fgSliderMode === 'standard' ? 'static' : fgSliderMode === 'static' ? 'dynamic' : 'standard'">
            <span class="sr-only" x-text="$store.uiStore.t('color.slider_mode')"></span>
            <span x-show="fgSliderMode === 'standard'" x-text="$store.uiStore.t('color.slider_standard')">Standard</span>
            <span x-show="fgSliderMode === 'standard'">
              <svg-icon name="circle-empty" size="14px"></svg-icon>
            </span>
            <span x-show="fgSliderMode === 'static'" x-text="$store.uiStore.t('color.slider_colored')">Coloured</span>
            <span x-show="fgSliderMode === 'static'">
              <svg-icon name="circle-dot" size="14px"></svg-icon>
            </span>
            <span x-show="fgSliderMode === 'dynamic'" x-text="$store.uiStore.t('color.slider_dynamic')">Dynamic</span>
            <span x-show="fgSliderMode === 'dynamic'">
              <svg-icon name="circle-full" size="14px"></svg-icon>
            </span>
          </button>
          <fieldset>
            <span aria-hidden="true">R</span>
            <legend class="sr-only" x-text="$store.uiStore.t('color.red')">Red</legend>
            <input
              x-bind:aria-label="$store.uiStore.t('color.component_value')"
              type="number" min="0" max="255" class="rgb-input"
              x-bind:value="$store.uiStore.foregroundRgb.split(',')[0]?.trim()"
              @change="$store.uiStore.updateColor('foreground', 'r', Math.min(255, Math.max(0, +$event.target.value)))"
            />
            <input
              x-bind:aria-label="$store.uiStore.t('color.component_slider')"
              type="range" min="0" max="255" class="slider-r"
              x-bind:value="$store.uiStore.foregroundRgb.split(',')[0]?.trim()"
              @input="$store.uiStore.updateColor('foreground', 'r', +$event.target.value)"
              x-bind:style="fgSliderMode === 'dynamic' ? `--slider-from: rgb(0,${$store.uiStore.foregroundRgb.split(',')[1]?.trim()},${$store.uiStore.foregroundRgb.split(',')[2]?.trim()}); --slider-to: rgb(255,${$store.uiStore.foregroundRgb.split(',')[1]?.trim()},${$store.uiStore.foregroundRgb.split(',')[2]?.trim()})` : ''"
            />
          </fieldset>
          <fieldset>
            <span aria-hidden="true">G</span>
            <legend class="sr-only" x-text="$store.uiStore.t('color.green')">Green</legend>
            <input
              x-bind:aria-label="$store.uiStore.t('color.component_value')"
              type="number" min="0" max="255" class="rgb-input"
              x-bind:value="$store.uiStore.foregroundRgb.split(',')[1]?.trim()"
              @change="$store.uiStore.updateColor('foreground', 'g', Math.min(255, Math.max(0, +$event.target.value)))"
            />
            <input
              x-bind:aria-label="$store.uiStore.t('color.component_slider')"
              type="range" min="0" max="255" class="slider-g"
              x-bind:value="$store.uiStore.foregroundRgb.split(',')[1]?.trim()"
              @input="$store.uiStore.updateColor('foreground', 'g', +$event.target.value)"
              x-bind:style="fgSliderMode === 'dynamic' ? `--slider-from: rgb(${$store.uiStore.foregroundRgb.split(',')[0]?.trim()},0,${$store.uiStore.foregroundRgb.split(',')[2]?.trim()}); --slider-to: rgb(${$store.uiStore.foregroundRgb.split(',')[0]?.trim()},255,${$store.uiStore.foregroundRgb.split(',')[2]?.trim()})` : ''"
            />
          </fieldset>
          <fieldset>
            <span aria-hidden="true">B</span>
            <legend class="sr-only" x-text="$store.uiStore.t('color.blue')">Blue</legend>
            <input
              x-bind:aria-label="$store.uiStore.t('color.component_value')"
              type="number" min="0" max="255" class="rgb-input"
              x-bind:value="$store.uiStore.foregroundRgb.split(',')[2]?.trim()"
              @change="$store.uiStore.updateColor('foreground', 'b', Math.min(255, Math.max(0, +$event.target.value)))"
            />
            <input
              x-bind:aria-label="$store.uiStore.t('color.component_slider')"
              type="range" min="0" max="255" class="slider-b"
              x-bind:value="$store.uiStore.foregroundRgb.split(',')[2]?.trim()"
              @input="$store.uiStore.updateColor('foreground', 'b', +$event.target.value)"
              x-bind:style="fgSliderMode === 'dynamic' ? `--slider-from: rgb(${$store.uiStore.foregroundRgb.split(',')[0]?.trim()},${$store.uiStore.foregroundRgb.split(',')[1]?.trim()},0); --slider-to: rgb(${$store.uiStore.foregroundRgb.split(',')[0]?.trim()},${$store.uiStore.foregroundRgb.split(',')[1]?.trim()},255)` : ''"
            />
          </fieldset>
        </div>
        <!-- Background Color -->
         <div class="wrapper"
            x-bind:style="`background-color: ${showControls ? '#ffffff' : $store.uiStore.foregroundHex}`">
            <section id="background"
              x-bind:style="`background-color: ${$store.uiStore.backgroundHex}`">
              <div
                class="color-preview"
                x-bind:class="$store.uiStore.backgroundIsDark ? 'isDark' : 'isLight'"
              >
                <h2 x-text="$store.uiStore.t('color.background')">Background</h2>
                <p class="color-value">
                  <span class="color-name" x-show="$store.uiStore.backgroundName" x-text="$store.uiStore.backgroundName"></span>
                  <span class="hex-value" :class="{ 'hex-secondary': $store.uiStore.backgroundName }" x-text="$store.uiStore.backgroundHex"></span>
                </p>
              </div>
              <div class="buttons">
                <div class="group">
                  <button
                    class="btn eyedropper"
                    @click="$store.uiStore.pickColor(false)"
                    x-bind:disabled="$store.uiStore.isPicking"
                    x-bind:aria-label="$store.uiStore.t('color.pick_background')"
                  >
                    <svg-icon name="eyedropper" size="24px"></svg-icon>
                  </button>
                  <button
                    class="btn"
                    @click="showBgControls = !showBgControls"
                    x-bind:disabled="$store.uiStore.isPicking"
                  >
                    <svg-icon name="sliders"></svg-icon>
                  </button>
                </div>
              </div>
            </section>
         </div>
        <!-- Background Color controls -->
        <div class="color-controls" x-bind:class="'slider-mode-' + bgSliderMode" x-show="showBgControls" x-transition>
          <button class="btn-slider-mode" @click="bgSliderMode = bgSliderMode === 'standard' ? 'static' : bgSliderMode === 'static' ? 'dynamic' : 'standard'">
            <span class="sr-only" x-text="$store.uiStore.t('color.slider_mode')"></span>
            <span x-show="bgSliderMode === 'standard'" x-text="$store.uiStore.t('color.slider_standard')">Standard</span>
            <span x-show="bgSliderMode === 'standard'">
              <svg-icon name="circle-empty" size="14px"></svg-icon>
            </span>
            <span x-show="bgSliderMode === 'static'" x-text="$store.uiStore.t('color.slider_colored')">Coloured</span>
            <span x-show="bgSliderMode === 'static'">
              <svg-icon name="circle-dot" size="14px"></svg-icon>
            </span>
            <span x-show="bgSliderMode === 'dynamic'" x-text="$store.uiStore.t('color.slider_dynamic')">Dynamic</span>
            <span x-show="bgSliderMode === 'dynamic'">
              <svg-icon name="circle-full" size="14px"></svg-icon>
            </span>
          </button>
          <fieldset class="color-component">
            <span aria-hidden="true">R</span>
            <legend class="sr-only" x-text="$store.uiStore.t('color.red')">Red</legend>
            <input x-bind:aria-label="$store.uiStore.t('color.component_value')"
            type="number" min="0" max="255" class="rgb-input"
              x-bind:value="$store.uiStore.backgroundRgb.split(',')[0]?.trim()"
              @change="$store.uiStore.updateColor('background', 'r', Math.min(255, Math.max(0, +$event.target.value)))"
            />
            <input type="range"
              x-bind:aria-label="$store.uiStore.t('color.component_slider')"
              min="0" max="255" class="slider-r"
              x-bind:value="$store.uiStore.backgroundRgb.split(',')[0]?.trim()"
              @input="$store.uiStore.updateColor('background', 'r', +$event.target.value)"
              x-bind:style="bgSliderMode === 'dynamic' ? `--slider-from: rgb(0,${$store.uiStore.backgroundRgb.split(',')[1]?.trim()},${$store.uiStore.backgroundRgb.split(',')[2]?.trim()}); --slider-to: rgb(255,${$store.uiStore.backgroundRgb.split(',')[1]?.trim()},${$store.uiStore.backgroundRgb.split(',')[2]?.trim()})` : ''"
            />
          </fieldset>
          <fieldset class="color-component">
            <span aria-hidden="true">G</span>
            <legend class="sr-only" x-text="$store.uiStore.t('color.green')">Green</legend>
            <input type="number" min="0" max="255" class="rgb-input"
              x-bind:aria-label="$store.uiStore.t('color.component_value')"
              x-bind:value="$store.uiStore.backgroundRgb.split(',')[1]?.trim()"
              @change="$store.uiStore.updateColor('background', 'g', Math.min(255, Math.max(0, +$event.target.value)))"
            />
            <input type="range"
              x-bind:aria-label="$store.uiStore.t('color.component_slider')"
              min="0" max="255" class="slider-g"
              x-bind:value="$store.uiStore.backgroundRgb.split(',')[1]?.trim()"
              @input="$store.uiStore.updateColor('background', 'g', +$event.target.value)"
              x-bind:style="bgSliderMode === 'dynamic' ? `--slider-from: rgb(${$store.uiStore.backgroundRgb.split(',')[0]?.trim()},0,${$store.uiStore.backgroundRgb.split(',')[2]?.trim()}); --slider-to: rgb(${$store.uiStore.backgroundRgb.split(',')[0]?.trim()},255,${$store.uiStore.backgroundRgb.split(',')[2]?.trim()})` : ''"
            />
          </fieldset>
          <fieldset class="color-component">
            <span aria-hidden="true">B</span>
            <legend class="sr-only" x-text="$store.uiStore.t('color.blue')">Blue</legend>
            <input type="number" min="0" max="255" class="rgb-input"
              x-bind:aria-label="$store.uiStore.t('color.component_value')"
              x-bind:value="$store.uiStore.backgroundRgb.split(',')[2]?.trim()"
              @change="$store.uiStore.updateColor('background', 'b', Math.min(255, Math.max(0, +$event.target.value)))"
            />
            <input type="range"
              x-bind:aria-label="$store.uiStore.t('color.component_slider')"
              min="0" max="255" class="slider-b"
              x-bind:value="$store.uiStore.backgroundRgb.split(',')[2]?.trim()"
              @input="$store.uiStore.updateColor('background', 'b', +$event.target.value)"
              x-bind:style="bgSliderMode === 'dynamic' ? `--slider-from: rgb(${$store.uiStore.backgroundRgb.split(',')[0]?.trim()},${$store.uiStore.backgroundRgb.split(',')[1]?.trim()},0); --slider-to: rgb(${$store.uiStore.backgroundRgb.split(',')[0]?.trim()},${$store.uiStore.backgroundRgb.split(',')[1]?.trim()},255)` : ''"
            />
          </fieldset>
        </div>
      </div>
      <!-- Contrast Ratio -->
      <section class="results" x-data="{ compact: true }">
        <p class="contrast-ratio">
          <span x-text="$store.uiStore.t('results.contrast_ratio')">Contrast Ratio</span>
          <span><strong class="ratio" x-text="$store.uiStore.contrastRatio"></strong>:1</span>
        </p>
        <div class="buttons">
          <button
            class="btn small"
            @click="compact = !compact"
            x-bind:aria-label="$store.uiStore.t('results.toggle_details')"
          >
            <svg-icon x-show="!compact" name="chevron-down"></svg-icon>
            <svg-icon x-show="compact" name="chevron-up"></svg-icon>
          </button>
        </div>
        <div class="progress" x-show="!compact" x-transition>
          <p class="label">
            <span x-text="$store.uiStore.t('results.regular_text')">Regular Text</span>
            <span class="fail" x-show="!$store.uiStore.level143Regular" x-text="$store.uiStore.t('results.fail')">FAIL</span>
            <span class="pass" x-show="$store.uiStore.level143Regular && !$store.uiStore.level146Regular" x-text="$store.uiStore.t('results.pass')">PASS</span>
            <span class="pass" x-show="$store.uiStore.level146Regular" x-text="$store.uiStore.t('results.pass')">PASS</span>
          </p>
          <!-- 1.4.3 Regular text 4.5 AA - 7 AAA -->
          <div class="progress-line">
            <span class="icon">
              <svg-icon name="text" size="1.5rem"></svg-icon>
              <svg-icon name="text" size="2.2rem" class="non-active"></svg-icon>
            </span>
            <progress-bar :position="$store.uiStore.contrastRatio" split1="4.5" split2="7" labels="ratios"></progress-bar>
          </div>
        </div>
        <div class="progress" x-show="!compact" x-transition>
          <p class="label">
            <span x-text="$store.uiStore.t('results.large_text')">Large Text</span>
            <span class="fail" x-show="!$store.uiStore.level143Large" x-text="$store.uiStore.t('results.fail')">FAIL</span>
            <span class="pass" x-show="$store.uiStore.level143Large && !$store.uiStore.level146Large" x-text="$store.uiStore.t('results.pass')">PASS</span>
            <span class="pass" x-show="$store.uiStore.level146Large" x-text="$store.uiStore.t('results.pass')">PASS</span>
          </p>
          <!-- 1.4.6 Large text 3.1 AA - 4.5 AAA -->
          <div class="progress-line">
            <span class="icon">
              <svg-icon name="text" size="2.2rem"></svg-icon>
              <svg-icon name="text" size="1.5rem" class="non-active"></svg-icon>
            </span>
            <progress-bar :position="$store.uiStore.contrastRatio" split1="3" split2="4.5" labels="ratios"></progress-bar>
          </div>
        </div>
        <div class="progress" x-show="!compact" x-transition>
          <p class="label">
            <span x-text="$store.uiStore.t('results.non_text')">Non-text</span>
            <span class="fail" x-show="!$store.uiStore.level1411" x-text="$store.uiStore.t('results.fail')">FAIL</span>
            <span class="pass" x-show="$store.uiStore.level1411" x-text="$store.uiStore.t('results.pass')">PASS</span>
          </p>
          <!-- 1.4.11 Non-text 3.1 AA -->
          <div class="progress-line">
            <span class="icon">
              <svg-icon name="toggle" size="2rem"></svg-icon>
            </span>
            <progress-bar :position="$store.uiStore.contrastRatio" split1="3" labels="ratios"></progress-bar>
          </div>
        </div>
        <!-- Vue compacte : icônes + pass/fail -->
        <div class="progress-compact" x-show="compact" x-transition>
          <div class="compact-item">
            <span class="icon">
              <svg-icon name="text" size="1.5rem"></svg-icon>
              <svg-icon name="text" size="2rem" class="non-active"></svg-icon>
            </span>
            <span class="fail" x-show="!$store.uiStore.level143Regular" x-text="$store.uiStore.t('results.fail')"></span>
            <span class="pass" x-show="$store.uiStore.level143Regular" x-text="$store.uiStore.t('results.pass')"></span>
          </div>
          <div class="compact-item">
            <span class="icon">
              <svg-icon name="text" size="2rem"></svg-icon>
              <svg-icon name="text" size="1.5rem" class="non-active"></svg-icon>
            </span>
            <span class="fail" x-show="!$store.uiStore.level143Large" x-text="$store.uiStore.t('results.fail')"></span>
            <span class="pass" x-show="$store.uiStore.level143Large" x-text="$store.uiStore.t('results.pass')"></span>
          </div>
          <div class="compact-item">
            <span class="icon">
              <svg-icon name="toggle" size="1.8rem"></svg-icon>
            </span>
            <span class="fail" x-show="!$store.uiStore.level1411" x-text="$store.uiStore.t('results.fail')"></span>
            <span class="pass" x-show="$store.uiStore.level1411" x-text="$store.uiStore.t('results.pass')"></span>
          </div>
        </div>
      </section>

      <!-- Toast de confirmation copie / Copy confirmation toast -->
      <div id="copy-toast" class="toast" aria-live="polite"></div>

      <!-- ICC Profile Status (debug/info) -->
      <!--section class="icc-status box" x-show="$store.uiStore.platform === 'macos'">
        <p>
          <strong>Colour Profile:</strong>
          <span x-text="$store.uiStore.currentICCProfile"></span>
        </p>
      </section-->
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
